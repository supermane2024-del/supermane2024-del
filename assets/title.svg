<svg xmlns="http://www.w3.org/2000/svg" width="900" height="90" viewBox="0 0 900 90" role="img" aria-label="Hi, I'm Supermane">
  <defs>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.6" stop-color="#e9d5ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <mask id="typewriterMask">
      <rect x="0" y="0" width="0" height="90" fill="#ffffff">
        <animate attributeName="width" values="0;410;410;0" keyTimes="0;0.55;0.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </mask>
  </defs>

  <rect x="0" y="0" width="900" height="90" rx="14" fill="#0b0713"/>
  <rect x="0.75" y="0.75" width="898.5" height="88.5" rx="13.5" fill="none" stroke="#35254b" stroke-width="1.5"/>

  <text x="28" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="40" font-weight="700" fill="url(#titleGradient)" mask="url(#typewriterMask)">Hi, I'm Supermane</text>

  <rect x="28" y="22" width="4" height="44" rx="2" fill="#c084fc">
    <animate attributeName="x" values="28;406;406;28" keyTimes="0;0.55;0.85;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>
