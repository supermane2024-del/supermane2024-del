<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Supermane - Dark Developer Portfolio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050409"/>
      <stop offset="0.55" stop-color="#0f0820"/>
      <stop offset="1" stop-color="#050409"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#5b21b6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#e9d5ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#a855f7" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect x="0" y="318" width="1200" height="2" fill="url(#accent)" opacity="0.8"/>

  <rect x="72" y="66" width="64" height="4" rx="2" fill="url(#accent)"/>

  <text x="72" y="158" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="4" fill="#ffffff">SUPERMANE</text>
  <text x="72" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="5" fill="#c084fc">DARK DEVELOPER / PORTFOLIO</text>
  <text x="72" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.5" fill="#9a91a8">SYSTEMS &#183; CODE &#183; GAMES &#183; CREATION</text>

  <g transform="translate(842, 68)">
    <rect x="0" y="0" width="292" height="184" rx="12" fill="#0b0812" stroke="#35254b" stroke-width="1.5"/>
    <rect x="0" y="0" width="292" height="34" rx="12" fill="#160f22"/>
    <rect x="0" y="22" width="292" height="12" fill="#160f22"/>
    <circle cx="22" cy="17" r="5" fill="#f87171"/>
    <circle cx="40" cy="17" r="5" fill="#fbbf24"/>
    <circle cx="58" cy="17" r="5" fill="#4ade80"/>
    <text x="82" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7e738f">supermane@dev:~</text>
    <text x="20" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#a855f7">$</text>
    <text x="38" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#e9e5f3">whoami</text>
    <text x="20" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#c084fc">&gt;</text>
    <text x="38" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#ffffff">supermane</text>
    <rect x="20" y="132" width="9" height="17" rx="1" fill="#c084fc">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
